[project]
name = "air-dj"
version = "0.1.0"
description = "Hand-gesture and keyboard controlled DJ interface"
requires-python = ">=3.9,<3.13"
readme = "README.md"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", "venv_py*", "songs", "ui"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter; legacy file is long)
    "B008",  # function calls in default args (common in this codebase)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
